name: Publish Test Server Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  android-agent:
    name: Test and build Android agent
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Bundle Android strings from i18n
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/i18n/manage.py bundle --target agent

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools build-tools;35.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent -> target"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-ndk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y --force cargo-ndk

      - name: Build Android Rust targets
        working-directory: agent
        run: |
          cargo ndk --target aarch64-linux-android build --lib
          cargo ndk --target x86_64-linux-android build --lib

      - name: Copy native libraries to Android project
        run: |
          mkdir -p android-agent/app/src/main/jniLibs/arm64-v8a
          mkdir -p android-agent/app/src/main/jniLibs/x86_64

          cp agent/target/aarch64-linux-android/debug/libguardian_agent.so \
            android-agent/app/src/main/jniLibs/arm64-v8a/

          cp agent/target/x86_64-linux-android/debug/libguardian_agent.so \
            android-agent/app/src/main/jniLibs/x86_64/

      - name: Generate UniFFI Kotlin bindings
        working-directory: agent
        run: |
          cargo run \
            --features=uniffi/cli \
            --bin uniffi-bindgen \
            generate \
            --language kotlin \
            --library \
            --no-format \
            --out-dir ../android-agent/app/src/main/java/ \
            target/aarch64-linux-android/debug/libguardian_agent.so

      - name: Build debug APK
        working-directory: android-agent
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature checksum
        run: |
          chmod +x scripts/android-signature-checksum.sh
          apk="$(find android-agent/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [[ -z "$apk" ]]; then
            echo "Debug APK not found after assembleDebug." >&2
            exit 1
          fi

          checksum="$(./scripts/android-signature-checksum.sh "$apk")"

          if [[ "$checksum" == "47DEQpj8HBSa-_TImW-5JCeuQeRkm5NMpJWZG3hSuFU" ]]; then
            echo "Checksum script returned empty digest; apksigner/build-tools may be missing." >&2
            exit 1
          fi

          echo "APK signature checksum: $checksum"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timekpr-android-agent-snapshot
          path: android-agent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-and-publish:
    needs: android-agent
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage i18n catalogs
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/i18n/manage.py bundle --target server
          python scripts/i18n/manage.py bundle --target extension

      - name: Package Chrome extension
        env:
          EXTENSION_SIGNING_KEY_PEM: ${{ secrets.EXTENSION_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail

          if [[ -n "${EXTENSION_SIGNING_KEY_PEM}" ]]; then
            mkdir -p server/static/extensions
            printf '%s' "${EXTENSION_SIGNING_KEY_PEM}" > server/static/extensions/key.pem
            python -m pip install --disable-pip-version-check crx3 cryptography
            python3 scripts/package-extension.py \
              --version "0.0.0" \
              --require-existing-key
          elif [[ -f server/static/extensions/youtube_monitor.crx ]]; then
            echo "EXTENSION_SIGNING_KEY_PEM not configured; using committed CRX artifact."
          else
            echo "No extension signing key and no committed CRX artifact available." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-arch test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mdausend/timekpr-webui-server:runtipi-test
          build-args: |
            SERVER_VERSION=runtipi-test
          cache-from: type=gha
          cache-to: type=gha,mode=max